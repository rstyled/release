name: Release

# Releases a repository that publishes no image: on its default branch, a commit whose Conventional Commits since the
# last release include a feat, fix, perf or breaking change is tagged vX.Y.Z, with a GitHub release that lists them.
# A repository that publishes an image calls image.yml instead, which releases after the image is published. A
# repository with its own build and deploy uses the version and release actions directly. See README.md.
on:
  workflow_call:
    inputs:
      initial-version:
        description: The first release of a repository with no vX.Y.Z tag yet.
        type: string
        default: 0.0.1
      notes:
        description: Markdown appended to the release notes.
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}
      released:
        value: ${{ jobs.release.outputs.released }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        uses: rstyled/release/version@v0.0
        with:
          initial-version: ${{ inputs.initial-version }}

  release:
    name: Release
    needs: version
    if: needs.version.outputs.release == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: rstyled/release/release@v0.0
        with:
          version: ${{ needs.version.outputs.version }}
          notes: ${{ inputs.notes }}
