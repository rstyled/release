name: Release
description: >-
  Tags the commit checked out as vVERSION and writes its GitHub release, listing the changes since the last one. A
  rerun completes what a failed run left, and retries GitHub's errors. Needs contents write and the full history
  (fetch-depth 0).
inputs:
  version:
    description: X.Y.Z, the version output of rstyled/release/version.
    required: true
  notes:
    description: Markdown appended to the release notes, for example the image the release published.
    default: ''
  token:
    description: A token with contents write.
    default: ${{ github.token }}
outputs:
  released:
    description: "'true' once the commit is released, by this run or by an earlier one this rerun completes."
    value: ${{ steps.release.outputs.released }}
runs:
  using: composite
  steps:
    - id: release
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        NOTES: ${{ inputs.notes }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        "$GITHUB_ACTION_PATH/../lib/release" | tee -a "$GITHUB_OUTPUT"
